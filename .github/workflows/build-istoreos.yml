name: Build iStoreOS for Tinker Board 2S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 签出当前仓库代码
      uses: actions/checkout@v3

    - name: 2. 安装编译所需的依赖环境
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync swig \
        unzip zlib1g-dev file wget curl util-linux
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

    - name: 3. 克隆 iStoreOS 源码并更新 Feeds
      run: |
        git clone --depth 1 https://github.com/linkease/iStoreOS.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 4. 注入 DTS 设备树与设备定义
      run: |
        # 复制上传的 DTS 文件到源码目录
        cp -r files/* openwrt/target/linux/rockchip/files/
        
        # 在 armv8.mk 中追加 Tinker Board 2S 设备构建规则
        cat << 'EOF' >> openwrt/target/linux/rockchip/image/armv8.mk

        define Device/asus_tinker-board-2
          DEVICE_VENDOR := ASUS
          DEVICE_MODEL := Tinker Board 2
          DEVICE_DTS := rk3399-tinker-board-2
          SUPPORTED_DEVICES := asus,tinker-board-2 asus,tinker-board-2s
          IMAGE_SIZE := 2048M
          DEVICE_PACKAGES := kmod-r8169 kmod-stmmac-rockchip
        endef
        TARGET_DEVICES += asus_tinker-board-2
        EOF

    - name: 5. 加载 .config 配置文件
      run: |
        cp .config openwrt/.config
        cd openwrt
        make defconfig

    - name: 6. 开始云端多核编译固件
      run: |
        cd openwrt
        make -j$(nproc) V=s || make -j1 V=s

    - name: 7. 打包并上传生成的镜像文件
      uses: actions/upload-artifact@v4
      with:
        name: iStoreOS-TinkerBoard2S-Firmware
        path: openwrt/bin/targets/rockchip/armv8/*sysupgrade.img.gz
